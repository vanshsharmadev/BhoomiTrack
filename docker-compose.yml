version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nlams_postgres
    restart: always
    environment:
      POSTGRES_DB: nlams_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nlams_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./server
    container_name: nlams_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nlams_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
    volumes:
      - app_uploads:/app/uploads

volumes:
  pgdata:
  app_uploads:
